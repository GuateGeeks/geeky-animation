name: Release Geeky

# Push a tag to release: git tag v1.2.0 && git push origin v1.2.0 (see docs/PACKAGE.md).
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag against package.json, manifest.json and CHANGELOG.md
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - name: Install development dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Check TypeScript declarations
        run: npm run typecheck
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Tell GuateGeeks/design-system
        env:
          GH_TOKEN: ${{ secrets.DESIGN_SYSTEM_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DESIGN_SYSTEM_DISPATCH_TOKEN is not set; the design system picks this release up on its weekly update run."
            exit 0
          fi
          gh api repos/GuateGeeks/design-system/dispatches -f event_type=geeky-release -f "client_payload[version]=${GITHUB_REF_NAME#v}"
